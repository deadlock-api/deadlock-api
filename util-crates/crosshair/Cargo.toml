[package]
name = "crosshair"
version = "0.1.0"
edition = "2024"
description = "Deadlock crosshair share codes (`DL.…`) to settings and back, and settings to PNG images"

[features]
utoipa = ["dep:utoipa"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
crc32fast = "1.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
murmur2 = "0.1.0"
prost = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
utoipa = { version = "6.0.0", optional = true }
zstd = "0.14"

[dev-dependencies]
rstest = "0.28.0"

[lints]
workspace = true
