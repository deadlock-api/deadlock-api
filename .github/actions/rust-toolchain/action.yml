name: Rust toolchain
description: >-
  The latest stable Rust (rust-toolchain.toml selects `stable`), plus the given components and
  targets.

inputs:
  components:
    description: "Space-separated rustup components to add (e.g. 'clippy rustfmt')."
    required: false
    default: ""
  targets:
    description: "Space-separated rustup targets to add (e.g. 'wasm32-unknown-unknown')."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Runner images ship whatever stable was current when they were built (Blacksmith's had 1.97
    # while 1.99 was out), and rustup never updates an installed channel by itself. Clippy lints
    # differ between versions, so CI updates to the stable that developers run.
    - name: Install latest stable Rust
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        if ! command -v rustup >/dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        args=()
        for c in $COMPONENTS; do args+=(--component "$c"); done
        for t in $TARGETS; do args+=(--target "$t"); done
        # Installs stable, or updates an installed one to the latest release.
        rustup toolchain install stable --profile minimal --no-self-update "${args[@]}"
        rustc --version
        cargo --version
