name: Set up Rust
description: >-
  System packages, the Rust toolchain and build caches for a job that compiles the cargo workspace.

inputs:
  cache-key:
    description: >-
      Cache name. Jobs whose builds differ (clippy vs test profile, other packages) need their own,
      or they evict each other's artifacts.
    required: true
  components:
    description: "Space-separated rustup components to add (e.g. 'clippy')."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # protoc for the valveprotos build script; mold because .cargo/config.toml links with it (clang
    # ships with the runner image). Prebuilt binaries install in seconds, apt-get update takes ~20 s.
    - name: Install protoc and mold
      uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: protoc,mold
    # .cargo/config.toml passes mold by its absolute path.
    - name: Link mold into /usr/bin
      shell: bash
      run: sudo ln -sf "$(command -v mold)" /usr/bin/mold

    - uses: ./.github/actions/rust-toolchain
      with:
        components: ${{ inputs.components }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: "${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}"
        # PR runs restore master's cache but don't save their own copy, so ref-scoped duplicates
        # don't evict master's entries from the 10 GB quota.
        save-if: ${{ github.ref == 'refs/heads/master' }}
