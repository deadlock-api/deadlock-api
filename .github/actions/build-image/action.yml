name: Build Rust image
description: >-
  Builds and pushes a Rust service image from the repo root on a GitHub-hosted runner. Compiled
  crates come from sccache in the GitHub Actions cache, the apt and toolchain layers from a registry
  cache next to the image, so a build with a fresh builder only compiles what changed. Needs a
  prior login to ghcr.io and the `packages: write` permission.

inputs:
  file:
    description: "Dockerfile path, relative to the repo root."
    required: true
  tags:
    description: "Image tags to push (newline-separated)."
    required: true
  cache-ref:
    description: "Registry ref of the layer cache, e.g. ghcr.io/owner/image:buildcache."
    required: true
  platforms:
    description: "Target platform; build it on a runner of the same architecture."
    required: false
    default: linux/amd64

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    # The cache service token is only in the environment of JavaScript actions; sccache in the
    # image build needs it (scripts/docker/with-sccache.sh).
    - name: Expose the Actions cache service to sccache
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        # One cargo workspace: every Rust image builds from the repo root.
        context: .
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ inputs.tags }}
        push: true
        # Secrets stay out of the layer cache keys, unlike build args.
        secrets: |
          ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
          ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
        # GHCR storage is free for public images and has no 10 GB cap, unlike the Actions cache.
        # mode=max keeps the builder stage's apt and sccache layers, not just the final image.
        cache-from: type=registry,ref=${{ inputs.cache-ref }}
        cache-to: type=registry,ref=${{ inputs.cache-ref }},mode=max,image-manifest=true,oci-mediatypes=true
