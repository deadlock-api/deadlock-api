name: Crates CI

# Checks for the shared library crates (crates/*, including valveprotos and haste with its
# dungers crates) and the website's wasm modules (website/wasm/*). Their consumers (api, workers,
# live-events, website) are checked by their own workflows, which also trigger on changes to
# these crates.

on:
  push:
    branches:
      - master
    paths: &paths
      - 'crates/**'
      - 'website/wasm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '_typos.toml'
      - '.github/workflows/crates-ci.yml'
      - '.github/workflows/rust-checks.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - master
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  checks:
    uses: ./.github/workflows/rust-checks.yml
    with:
      packages: >-
        assets-client clickhouse-utils crosshair db-clients demofusion game-assets keyvalues rate-limit
        service-utils steam-id steam-proxy telemetry valveprotos
        haste haste_core haste_broadcast haste_vartype
        dungers dungers_bitbuf dungers_charsor dungers_varint
        crosshair-wasm hero-build wasm-abi
      paths: crates website/wasm
      typos-paths: crates website/wasm
      test: true
      cache-key: crates-build-cache
