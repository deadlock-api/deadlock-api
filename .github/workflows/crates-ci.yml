name: Crates CI

# Checks for the library crates imported into the workspace (valveprotos, and
# haste with its dungers crates) and the website's wasm modules (website/wasm/*).
# Their consumers (api, tools, live-events, website) are checked by their own
# workflows, which also trigger on changes to these crates.

on:
  push:
    branches:
      - master
    paths:
      - 'valveprotos/**'
      - 'haste/**'
      - 'website/wasm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.github/workflows/crates-ci.yml'
      - '.github/workflows/rust-ci-checks.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'valveprotos/**'
      - 'haste/**'
      - 'website/wasm/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.github/workflows/crates-ci.yml'
      - '.github/workflows/rust-ci-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  valveprotos:
    uses: ./.github/workflows/rust-ci-checks.yml
    with:
      working-directory: valveprotos
      packages: valveprotos
      clippy-args: --all-features
      typos: false
      lint-extra-apt-packages: clang mold
      rust-cache-shared-key: valveprotos-build-cache

  haste:
    uses: ./.github/workflows/rust-ci-checks.yml
    with:
      working-directory: haste
      packages: haste haste_core haste_broadcast haste_vartype dungers dungers_bitbuf dungers_charsor dungers_varint
      clippy-args: --all-features
      typos: false
      lint-extra-apt-packages: clang mold
      rust-cache-shared-key: haste-build-cache

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev clang mold
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "crates-test-cache-${{ runner.os }}-${{ runner.arch }}"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Tests
        run: cargo test --locked -p valveprotos -p haste -p haste_core -p haste_broadcast -p haste_vartype -p dungers -p dungers_bitbuf -p dungers_charsor -p dungers_varint --all-features

  website-wasm:
    uses: ./.github/workflows/rust-ci-checks.yml
    with:
      working-directory: website/wasm
      packages: hero-build wasm-abi
      typos: false
      lint-extra-apt-packages: clang mold
      rust-cache-shared-key: website-wasm-build-cache
