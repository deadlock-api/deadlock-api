name: Prune Blacksmith Cache

# Manually deletes Blacksmith cache entries by key prefix, e.g. to reclaim the
# repo's cache quota from entries that would otherwise sit there until evicted.

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: 'Delete every cache entry whose key starts with this prefix'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prune:
    name: Prune
    # useblacksmith/cache-delete only works on Blacksmith runners.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/cache-delete@941f534fcf46c8d0a89feeceeb0f5377d82dd5e7 # v2
        with:
          key: ${{ inputs.prefix }}
          prefix: true
