name: Rust CI Checks

# Reusable checks for one component of the root cargo workspace. Cargo runs
# from the repo root, scoped to the component with `packages`, so each
# component's workflow gates its own deploy.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Component directory, used for machete and typos."
        required: true
        type: string
      packages:
        description: "Space-separated cargo packages of the component (passed as -p)."
        required: true
        type: string
      clippy-args:
        description: "Extra arguments for cargo clippy (e.g. '--all-features')."
        required: false
        type: string
        default: ""
      typos:
        description: "Whether to run typos on <working-directory>/src."
        required: false
        type: boolean
        default: true
      lint-runs-on:
        description: "Runner label for the lint job."
        required: false
        type: string
        default: ubuntu-latest
      lint-extra-apt-packages:
        description: "Space-separated extra apt packages to install before clippy (e.g. 'clang mold')."
        required: false
        type: string
        default: ""
      lint-install-rust-toolchain:
        description: "Whether to install the Rust toolchain via rustup installer script (needed on self-hosted runners without Rust pre-installed)."
        required: false
        type: boolean
        default: false
      rust-cache-shared-key:
        description: "Shared key prefix for Swatinem/rust-cache."
        required: true
        type: string

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt
      - name: Rustfmt Check
        run: cargo fmt $(printf -- '-p %s ' ${{ inputs.packages }}) -- --check

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: cargo-machete
      - name: Machete
        run: cargo machete

  typos:
    name: Typos
    if: inputs.typos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: typos-cli
      - name: Typos Check
        run: typos src/

  lint:
    name: Lint
    runs-on: ${{ inputs.lint-runs-on }}
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev ${{ inputs.lint-extra-apt-packages }}
      - name: Install Rust toolchain
        if: inputs.lint-install-rust-toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "${{ inputs.rust-cache-shared-key }}-${{ runner.os }}-${{ runner.arch }}"
          # PR runs restore master's cache but don't save their own copy, so
          # ref-scoped duplicates don't evict master's entries from the quota.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: rustup component add clippy
      - name: Cargo Clippy
        run: cargo clippy $(printf -- '-p %s ' ${{ inputs.packages }}) --all-targets --locked ${{ inputs.clippy-args }} -- -D warnings
