name: Tools CI/CD

env:
  CARGO_TERM_COLOR: always

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'tools/**'
      - '.sqlx/**'
      - '.github/workflows/tools-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'valveprotos/**'
      - 'haste/**'
      - 'dungers/**'
      - '.github/workflows/rust-ci-checks.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'tools/**'
      - '.sqlx/**'
      - '.github/workflows/tools-ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'valveprotos/**'
      - 'haste/**'
      - 'dungers/**'
      - '.github/workflows/rust-ci-checks.yml'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  checks:
    uses: ./.github/workflows/rust-ci-checks.yml
    with:
      working-directory: tools
      packages: >-
        active-matches-scraper builds-fetcher common demo-analyzer friends-rank-fetcher
        history-fetcher hltv-scraper ingest-worker matchdata-downloader salt-scraper
        steam-profile-fetcher update-assets-tables
      clippy-args: --all-features
      # tools never ran typos
      typos: false
      lint-extra-apt-packages: clang mold
      rust-cache-shared-key: tools-build-cache

  build-base:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: deadlock-api/tools-base
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Base Image
        id: build-base
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          # Build context is the repo root: tools are members of the root cargo workspace.
          context: .
          file: tools/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/tools-base:latest

  push-components:
    runs-on: ubuntu-latest
    needs: build-base
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    strategy:
      matrix:
        component:
          - salt-scraper
          - hltv-scraper
          - ingest-worker
          - matchdata-downloader
          - active-matches-scraper
          - builds-fetcher
          - history-fetcher
          - steam-profile-fetcher
          - update-assets-tables
          - demo-analyzer
          - friends-rank-fetcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Filter changed paths
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            change: [ 'tools/${{ matrix.component }}/**', 'tools/common/**', 'tools/Dockerfile', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'valveprotos/**', 'haste/**', 'dungers/**', '.sqlx/**' ]
      - name: Check if component should build
        id: should_deploy
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.changes.outputs['change'] }}" == "true" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Docker
        if: steps.should_deploy.outputs.deploy == 'true'
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
      - name: Login to GitHub Container Registry
        if: steps.should_deploy.outputs.deploy == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Component
        if: steps.should_deploy.outputs.deploy == 'true'
        run: |
          docker pull ghcr.io/${{ github.repository }}/tools-base:latest
          docker tag ghcr.io/${{ github.repository }}/tools-base:latest ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
          docker push ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest
