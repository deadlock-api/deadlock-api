name: Workers CI/CD

env:
  CARGO_TERM_COLOR: always
  BASE_IMAGE: ghcr.io/${{ github.repository }}/tools-base

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths: &paths
      - 'workers/**'
      - 'crates/**'
      - '.sqlx/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '_typos.toml'
      - 'scripts/docker/**'
      - '.dockerignore'
      - '.github/workflows/workers-ci.yml'
      - '.github/workflows/rust-checks.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - master
    paths: *paths

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  checks:
    uses: ./.github/workflows/rust-checks.yml
    with:
      packages: >-
        active-matches-scraper builds-fetcher demo-analyzer
        history-fetcher hltv-scraper ingest-worker matchdata-downloader player-match-history salt-scraper
        steam-profile-fetcher update-assets-tables
      paths: workers
      typos-paths: workers
      cache-key: tools-build-cache

  # One image holds every worker binary. It builds in parallel with the checks; the components'
  # tags only move to it once those pass.
  build-base:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-image
        with:
          file: workers/Dockerfile
          tags: ${{ env.BASE_IMAGE }}:build-${{ github.sha }}
          cache-ref: ${{ env.BASE_IMAGE }}:buildcache

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [checks, build-base]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    env:
      # Deployed components: each one pulls the base image under its own name.
      COMPONENTS: >-
        active-matches-scraper builds-fetcher demo-analyzer history-fetcher hltv-scraper
        ingest-worker matchdata-downloader salt-scraper steam-profile-fetcher update-assets-tables
      # Everything every worker builds on.
      SHARED_PATHS: >-
        crates/** .sqlx/** workers/player-match-history/**
        workers/Dockerfile scripts/docker/** .dockerignore Cargo.toml Cargo.lock rust-toolchain.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate path filters
        id: filters
        run: |
          set -f # the paths are globs for the filter, not for the shell
          {
            echo 'yaml<<EOF'
            for component in $COMPONENTS; do
              echo "$component:"
              for path in "workers/$component/**" $SHARED_PATHS; do echo "  - '$path'"; done
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Filter changed components
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: ${{ steps.filters.outputs.yaml }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Re-tags on the registry, no image data moves. A manual run redeploys every component.
      # `tools-base:latest` keeps pointing at the newest build for anyone pulling the base directly.
      - name: Promote base image to changed components
        env:
          BUILD: ${{ env.BASE_IMAGE }}:build-${{ github.sha }}
          CHANGES: ${{ steps.changes.outputs.changes }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH" == "true" ]]; then
            components=$COMPONENTS
          else
            # The filter names of the changed components, as a JSON array of plain names.
            components=$(tr -d '[]"' <<<"$CHANGES" | tr ',' ' ')
          fi
          docker buildx imagetools create -t "$BASE_IMAGE:latest" "$BUILD"
          for component in $components; do
            echo "Deploying $component"
            docker buildx imagetools create -t "$IMAGE_PREFIX/$component:latest" "$BUILD"
          done
