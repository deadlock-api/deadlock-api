name: Website Security Audit

on:
  push:
    paths:
      - 'website/**/pnpm-lock.yaml'
      - 'website/**/package.json'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      level:
        description: "The level of vulnerability to report (low, moderate, high, critical)"
        required: false
        default: high
        type: choice
        options:
          - low
          - moderate
          - high
          - critical

jobs:
  audit:
    name: PNPM Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install dependencies
        run: pnpm install

      - name: Run pnpm audit
        run: pnpm audit --audit-level ${{ inputs.level || 'high' }} --json > pnpm-audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-audit-report
          path: website/pnpm-audit-report.json
