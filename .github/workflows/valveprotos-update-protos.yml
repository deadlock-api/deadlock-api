name: Update Protos

# Pulls the latest protos from SteamDatabase/Protobufs into valveprotos/protos.
# If a protos PR is already open, the update is added as a new commit to it;
# otherwise a fresh branch is cut from master and a PR is opened. Migrated from
# the standalone valveprotos-rs repository.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-protos
  cancel-in-progress: false

env:
  BRANCH: valveprotos/update-protos
  # Pushes and PRs made with GITHUB_TOKEN don't trigger other workflows, so the
  # PR's CI only runs when a PAT / app token is provided as PROTOS_PR_TOKEN.
  GH_TOKEN: ${{ secrets.PROTOS_PR_TOKEN || github.token }}

jobs:
  update-protos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PROTOS_PR_TOKEN || github.token }}

      - name: Check out the open protos PR, if any
        id: pr
        run: |
          pr=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          if [ -n "$pr" ]; then
            echo "Adding to PR #$pr"
            git fetch --depth=1 origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            echo "No open protos PR; starting from master"
            git checkout -B "$BRANCH"
          fi

      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev clang mold

      - name: Update Rust toolchain to stable
        run: |
          rustup override set stable
          rustup update stable
          rustup component add rustfmt

      - name: Run fetch-protos
        # fetch-protos reads and writes paths relative to the crate root. The build
        # script needs the proto features on, or protoc gets no input files.
        working-directory: valveprotos
        run: cargo run --locked -p valveprotos --all-features --bin fetch-protos

      - name: Commit and push, open a PR if none is open
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          git add -A valveprotos/protos
          if git diff --cached --quiet; then
            echo "Protos are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "valveprotos: update protos"
          if [ -n "$PR" ]; then
            git push origin "$BRANCH"
          else
            # A leftover branch from a merged or closed PR is replaced.
            git push --force origin "$BRANCH"
            gh pr create --base master --head "$BRANCH" \
              --title "valveprotos: update protos" \
              --body "Latest protos from [SteamDatabase/Protobufs](https://github.com/SteamDatabase/Protobufs), fetched by the scheduled \`Update Protos\` workflow. Later updates are added to this PR as new commits while it is open.

          Merging this rebuilds and deploys api, tools and live-events, since they depend on valveprotos."
          fi
