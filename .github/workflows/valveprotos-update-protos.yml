name: Update Protos

# Pulls the latest protos from SteamDatabase/Protobufs into valveprotos/protos
# and opens (or updates) a PR with the changes. Migrated from the standalone
# valveprotos-rs repository.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-protos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Protocol Buffers compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev clang mold

      - name: Update Rust toolchain to stable
        run: |
          rustup override set stable
          rustup update stable
          rustup component add rustfmt

      - name: Run fetch-protos
        # fetch-protos reads and writes paths relative to the crate root.
        working-directory: valveprotos
        run: cargo run --locked -p valveprotos --features requests --bin fetch-protos

      - name: Open or update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # PRs opened with GITHUB_TOKEN don't trigger other workflows, so the PR's
          # CI only runs when a PAT / app token is provided as PROTOS_PR_TOKEN.
          token: ${{ secrets.PROTOS_PR_TOKEN || github.token }}
          add-paths: valveprotos/protos
          branch: valveprotos/update-protos
          delete-branch: true
          commit-message: "valveprotos: update protos"
          title: "valveprotos: update protos"
          body: |
            Latest protos from [SteamDatabase/Protobufs](https://github.com/SteamDatabase/Protobufs), fetched by the scheduled `Update Protos` workflow.

            Merging this rebuilds and deploys api, tools and live-events, since they depend on valveprotos.
