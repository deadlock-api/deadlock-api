name: Website CI

on:
  push:
    branches:
      - master
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  workflow_dispatch:

jobs:
  ci:
    name: Fmt, Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm fmt && git diff --exit-code

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        # Every *.test.ts(x) under src/, tracker tests included.
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Upload build
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-dist
          path: website/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Deploys the build tested above. Replaces Cloudflare's Workers Builds git integration, whose
  # builds failed or lagged too often.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
    # A newer push carries every older change, so it may cancel a deploy still waiting to run.
    concurrency:
      group: website-deploy
      cancel-in-progress: true
    environment:
      name: production
      url: https://deadlock-api.com
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-dist
          path: website/dist

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7b4321d09caf87be3ab50ee6972e9575
