name: Website CI

on:
  push:
    branches:
      - master
    paths: &paths
      - 'website/**'
      - '.github/workflows/website-ci.yml'
      # The tracker demo ports its metric formulas (website/src/lib/tracker/player-metric-formulas.ts).
      - 'api-crates/api/src/routes/v1/analytics/player_stats_metrics.rs'
      # The crosshair editor ports the renderer (website/src/lib/crosshair-render.ts), tested against its PNGs.
      - 'api-crates/api/src/services/crosshair/render.rs'
      - 'api-crates/api/src/services/crosshair/fixtures/**'
      # The wasm modules (website/wasm/*) build on valveprotos in the root cargo workspace.
      - 'util-crates/valveprotos/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/actions/rust-toolchain/**'
  pull_request:
    branches:
      - master
    paths: *paths
  workflow_dispatch:

jobs:
  ci:
    name: Fmt, Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm fmt && git diff --exit-code

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The wasm modules (website/wasm/*, built by scripts/build-wasm.mjs) need the wasm target and protoc
      # (valveprotos); `pnpm test:unit` and `pnpm build` build them.
      - name: Install protoc
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: protoc

      - name: Install Rust with the wasm target
        uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: website-wasm-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Unit tests
        # Every *.test.ts(x) under src/, tracker tests included.
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      # Master pushes deploy it; pull requests from this repo get a preview. Fork PRs get neither,
      # since GitHub does not hand them the Cloudflare secret.
      - name: Upload build
        if: >-
          (github.ref == 'refs/heads/master' && github.event_name != 'pull_request')
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-dist
          path: website/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Deploys the build tested above. Replaces Cloudflare's Workers Builds git integration, whose
  # builds failed or lagged too often.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: read
    # A newer push carries every older change, so it may cancel a deploy still waiting to run.
    concurrency:
      group: website-deploy
      cancel-in-progress: true
    environment:
      name: production
      url: https://deadlock-api.com
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-dist
          path: website/dist

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7b4321d09caf87be3ab50ee6972e9575

  # Uploads the PR's build as a new Worker version without routing production traffic to it, at a
  # stable per-PR preview URL. It shares the production Worker's secrets and bindings, and calls
  # the production API.
  preview:
    name: Preview
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: website-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-dist
          path: website/dist

      - name: Upload preview version
        id: upload
        run: |
          pnpm exec wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} ${HEAD_SHA}"
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url // empty' \
            "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          if [ -z "$url" ]; then
            echo "::error::wrangler reported no preview URL; are preview URLs enabled on the Worker?"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7b4321d09caf87be3ab50ee6972e9575
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Comment preview URL
        run: |
          marker="<!-- website-preview -->"
          body="${marker}
          **Website preview:** ${PREVIEW_URL}

          Built from ${HEAD_SHA}. Shares the production Worker's secrets and calls the production API."
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" \
            | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
