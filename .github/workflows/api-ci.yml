name: API CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to push (e.g., v1.0.0, specific-feature)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ###############################
  ##    Stage 1: Lint & Check  ##
  ###############################

  checks:
    uses: ./.github/workflows/rust-ci-checks.yml
    with:
      working-directory: api
      lint-runs-on: blacksmith-4vcpu-ubuntu-2404
      lint-extra-apt-packages: clang mold
      lint-install-rust-toolchain: true
      rust-cache-shared-key: api-build-cache

  ###############################
  ##     Stage 2: Test         ##
  ###############################

  test:
    name: Test
    timeout-minutes: 40
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: api
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          lfs: true
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev clang mold
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Dedicated key: the test profile's artifacts differ from the clippy
          # job's, so they must not share a (immutable) cache key.
          shared-key: "api-test-cache-${{ runner.os }}-${{ runner.arch }}"
          workspaces: "api -> target"
          # PR runs restore master's cache but don't save their own copy, so
          # ref-scoped duplicates don't evict master's entries from the quota.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Tests
        run: cargo test --locked
        env:
          # Read credentials for the R2 bucket holding versioned game assets.
          # Used by the integration tests to validate hero/rank IDs against
          # real data. R2_ENDPOINT is intentionally left unset so it defaults
          # to the Cloudflare S3 API endpoint, which supports object listing.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  ###############################
  ##  Stage 2b: Build Image    ##
  ###############################

  # Runs in parallel with checks/test. The image is pushed under a per-commit
  # staging tag only; nothing consumes it until deploy promotes it.
  build:
    name: Build Image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          lfs: true
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Docker Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: deadlock-api/api
      - name: Build and push Docker image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: api
          tags: ${{ env.IMAGE_NAME }}:build-${{ github.sha }}
          push: true

  ###############################
  ##     Stage 3: Deploy       ##
  ###############################

  deploy:
    name: Deploy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: [checks, test, build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - name: Determine Docker Tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DOCKER_TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            DOCKER_TAG="latest"
          fi
          echo "DOCKER_TAG=$DOCKER_TAG" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote staged image
        run: |
          docker buildx imagetools create -t "${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}" \
            "${{ env.IMAGE_NAME }}:build-${{ github.sha }}"
