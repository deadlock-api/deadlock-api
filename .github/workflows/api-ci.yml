name: API CI/CD

on:
  push:
    branches:
      - master
    paths: &paths
      - 'api/**'
      - 'workers/player-match-history/**'
      - 'crates/**'
      - '.sqlx/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '_typos.toml'
      - 'scripts/docker/**'
      - '.dockerignore'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/rust-checks.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - master
    paths: *paths
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to push (e.g., v1.0.0, specific-feature)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ###############################
  ##  Stage 1: Lint & Test     ##
  ###############################

  checks:
    uses: ./.github/workflows/rust-checks.yml
    secrets: inherit
    with:
      packages: deadlock-api
      paths: api
      typos-paths: api
      test: true
      cache-key: api-build-cache
      test-cache-key: api-test

  ###############################
  ##  Stage 1b: Build Image    ##
  ###############################

  # Runs in parallel with the checks. The image is pushed under a per-commit
  # staging tag only; nothing consumes it until deploy promotes it.
  build:
    name: Build Image
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-image
        with:
          file: api/Dockerfile
          tags: ${{ env.IMAGE_NAME }}:build-${{ github.sha }}
          cache-ref: ${{ env.IMAGE_NAME }}:buildcache

  ###############################
  ##     Stage 2: Deploy       ##
  ###############################

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [checks, build]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    steps:
      - name: Determine Docker Tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            DOCKER_TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            DOCKER_TAG="latest"
          fi
          echo "DOCKER_TAG=$DOCKER_TAG" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote staged image
        run: |
          docker buildx imagetools create -t "${{ env.IMAGE_NAME }}:${{ env.DOCKER_TAG }}" \
            "${{ env.IMAGE_NAME }}:build-${{ github.sha }}"
