pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all && git add -u {staged_files}
      fail_text: "Rust formatting failed"

    api-machete:
      root: "api/"
      glob: "api/{Cargo.toml,src/**}"
      run: cargo machete
      fail_text: "Unused dependencies in api/. Run 'cargo machete --fix' to fix."

    tools-machete:
      root: "tools/"
      glob: "tools/{**/Cargo.toml,**/*.rs}"
      run: cargo machete
      fail_text: "Unused dependencies in tools/. Run 'cargo machete --fix' to fix."

    live-events-machete:
      root: "live-events/"
      glob: "live-events/{Cargo.toml,src/**}"
      run: cargo machete
      fail_text: "Unused dependencies in live-events/. Run 'cargo machete --fix' to fix."

    api-typos:
      root: "api/"
      glob: "api/src/**"
      run: typos src/
      fail_text: "Typos found in api/src/. Run 'typos --write-changes src/' to fix."

    website-fmt:
      root: "website/"
      glob: "website/**/*.{ts,tsx,js,jsx,css}"
      run: pnpm fmt && git add -u {staged_files}
      fail_text: "Website formatting failed"

    website-lint:
      root: "website/"
      glob: "website/**/*.{ts,tsx,js,jsx}"
      run: pnpm lint
      fail_text: "oxlint found issues in website/. Run 'pnpm lint' to see details."

pre-push:
  parallel: true
  commands:
    rust-clippy:
      glob: "{*.rs,**/Cargo.toml,Cargo.lock}"
      run: SQLX_OFFLINE=true cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      fail_text: "Clippy warnings in the cargo workspace"

    website-build:
      root: "website/"
      glob: "website/**/*.{ts,tsx,js,jsx,css}"
      run: pnpm build
      fail_text: "Website build failed"
