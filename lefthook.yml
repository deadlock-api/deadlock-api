pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all && git add -u {staged_files}
      fail_text: "Rust formatting failed"

    rust-machete:
      glob: "{*.rs,**/Cargo.toml}"
      run: cargo machete
      fail_text: "Unused dependencies in the cargo workspace. Run 'cargo machete --fix' to fix."

    # The crates CI also runs typos on (config: _typos.toml).
    rust-typos:
      glob: "{api,live-events,util-crates,worker-crates}/**"
      run: typos api live-events util-crates worker-crates
      fail_text: "Typos found. Run the same typos command with --write-changes to fix."

    website-fmt:
      root: "website/"
      glob: "website/**/*.{ts,tsx,js,jsx,css}"
      run: pnpm fmt && git add -u {staged_files}
      fail_text: "Website formatting failed"

    website-lint:
      root: "website/"
      glob: "website/**/*.{ts,tsx,js,jsx}"
      run: pnpm lint
      fail_text: "oxlint found issues in website/. Run 'pnpm lint' to see details."

pre-push:
  parallel: true
  commands:
    rust-clippy:
      glob: "{*.rs,**/Cargo.toml,Cargo.lock,clippy.toml}"
      run: SQLX_OFFLINE=true cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      fail_text: "Clippy warnings in the cargo workspace"

    website-build:
      root: "website/"
      glob: "website/**/*.{ts,tsx,js,jsx,css}"
      run: pnpm build
      fail_text: "Website build failed"
