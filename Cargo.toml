[workspace]
members = [
    "api-crates/*",
    "live-events",
    "util-crates/*",
    "util-crates/haste/crates/*",
    "website/wasm/*",
    "worker-crates/active-matches-scraper",
    "worker-crates/builds-fetcher",
    "worker-crates/demo-analyzer",
    "worker-crates/history-fetcher",
    "worker-crates/hltv-scraper",
    "worker-crates/ingest-worker",
    "worker-crates/matchdata-downloader",
    "worker-crates/player-match-history",
    "worker-crates/salt-scraper",
    "worker-crates/steam-profile-fetcher",
    "worker-crates/update-assets-tables",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Shared in-repo crates
assets-client = { path = "util-crates/assets-client" }
clickhouse-utils = { path = "util-crates/clickhouse-utils" }
crosshair = { path = "util-crates/crosshair" }
db-clients = { path = "util-crates/db-clients" }
demofusion = { path = "util-crates/demofusion" }
game-assets = { path = "util-crates/game-assets" }
keyvalues = { path = "util-crates/keyvalues" }
player-match-history = { path = "worker-crates/player-match-history" }
rate-limit = { path = "api-crates/rate-limit" }
service-utils = { path = "util-crates/service-utils" }
steam-id = { path = "util-crates/steam-id" }
steam-proxy = { path = "util-crates/steam-proxy" }
telemetry = { path = "util-crates/telemetry" }
valveprotos = { path = "util-crates/valveprotos" }
wasm-abi = { path = "website/wasm/abi" }
haste = { path = "util-crates/haste" }
haste_broadcast = { path = "util-crates/haste/crates/haste_broadcast" }
haste_core = { path = "util-crates/haste/crates/haste_core" }
haste_vartype = { path = "util-crates/haste/crates/haste_vartype" }
dungers = { path = "util-crates/haste/crates/dungers" }
dungers_bitbuf = { path = "util-crates/haste/crates/dungers_bitbuf" }
dungers_charsor = { path = "util-crates/haste/crates/dungers_charsor" }
dungers_varint = { path = "util-crates/haste/crates/dungers_varint" }

async-compression = "0.4.51"
base64 = "0.23.1"
cached = "4.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
clickhouse = { version = "0.15.3", features = ["zstd"] }
futures = "0.3.34"
itertools = "0.15.0"
metrics = "0.24.6"
object_store = { version = "0.14.2", features = ["aws"] }
opentelemetry = { version = "0.33", features = ["logs", "trace"] }
opentelemetry_sdk = { version = "0.33", features = ["logs", "trace"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "logs", "trace"] }
opentelemetry-appender-tracing = { version = "0.33", features = ["experimental_metadata_attributes"] }
prost = "0.14.4"
rand = "0.10.3"
redis = { version = "1.8.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1.21"
sqlx = "0.9.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-opentelemetry = "0.34"
tryhard = "0.5.2"

# haste, dungers
bytes = "1.12.1"
expect-test = "1.5.1"
hashbrown = { version = "0.17.1", default-features = false }
http = "1.5.0"
log = "0.4.34"
nohash = "0.2.0"
snap = "1.1.2"

# The website's wasm modules (website/wasm/*, built by website/scripts/build-wasm.mjs): small over fast.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.test.package.libduckdb-sys]
opt-level = 3
[profile.test.package.clickhouse-sql-parser]
opt-level = 3
[profile.test.package.antlr4rust]
opt-level = 3

# Strict lints for every crate (each member opts in with `[lints] workspace = true`).
# Production code must not be able to panic: no unwrap/expect, panicking macros, indexing,
# overflowing arithmetic or asserts (clippy.toml bans the assert macros and panicking std
# methods). Tests are exempt: each crate root allows these under `cfg(test)`.
[workspace.lints.rust]
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Panics
arithmetic_side_effects = "deny"
expect_used = "deny"
exit = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

# Restriction lints
allow_attributes_without_reason = "deny"
assertions_on_result_states = "deny"
cfg_not_test = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
deref_by_slicing = "deny"
empty_drop = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
float_cmp_const = "deny"
format_push_string = "deny"
fn_to_numeric_cast_any = "deny"
if_then_some_else_none = "deny"
infinite_loop = "deny"
large_include_file = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
multiple_unsafe_ops_per_block = "deny"
needless_raw_strings = "deny"
pathbuf_init_then_push = "deny"
precedence_bits = "deny"
rc_buffer = "deny"
print_stderr = "deny"
print_stdout = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
rest_pat_in_fully_bound_structs = "deny"
return_and_then = "deny"
same_name_method = "deny"
self_named_module_files = "deny"
std_instead_of_core = "deny"
str_to_string = "deny"
string_add = "deny"
string_lit_chars_any = "deny"
try_err = "deny"
unnecessary_self_imports = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unneeded_field_pattern = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
verbose_file_reads = "deny"

# Opted out
imprecise_flops = "allow" # rewrites change float results (demo decoding, renderer parity with its TS port)
missing_errors_doc = "allow" # error docs on every fallible fn add noise, not safety
redundant_pub_crate = "allow" # contradicts rustc's unreachable_pub
significant_drop_tightening = "allow" # false positives on #[cached] fns; a perf hint, not safety
unreadable_literal = "allow" # game/item/account ids are matched verbatim against game data
suboptimal_flops = "allow" # mul_add etc. round differently, see imprecise_flops
