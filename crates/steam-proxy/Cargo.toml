[package]
name = "steam-proxy"
version = "0.1.0"
edition = "2024"
description = "Request and response types of sv-proxy, a client for it, and the client version the Game Coordinator accepts"

[dependencies]
base64 = { workspace = true }
cached = { workspace = true, features = ["async"] }
metrics = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
valveprotos = { workspace = true, features = ["gc-client", "serde"] }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
