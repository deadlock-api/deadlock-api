[package]
name = "clickhouse"
version = "0.15.3"
description = "ClickHouse client over HTTP and the native TCP protocol (formerly raimannma/clickhouse-rs, a fork of the official clickhouse crate)"
license = "MIT OR Apache-2.0"
edition.workspace = true
publish = false

[features]
default = ["lz4"]

test-util = ["hyper/server"]
inserter = ["dep:quanta"]
uuid = ["dep:uuid"]
time = ["dep:time"]
lz4 = ["dep:lz4_flex", "dep:cityhash-rs", "dep:twox-hash"]
zstd = ["dep:zstd", "dep:cityhash-rs"]
chrono = ["dep:chrono"]
futures03 = []
opentelemetry = ["dep:opentelemetry", "dep:opentelemetry-http"]
# The native TCP protocol transport, selected by `tcp://` and `tcps://` URLs.
tcp = ["tokio/net", "tokio/io-util", "tokio/sync", "tokio/time"]

##  TLS
# `tokio-native-tls` and `tokio-rustls` are dependencies of `hyper-tls` and `hyper-rustls`,
# used directly by the `tcp` feature for `tcps://` URLs.
native-tls = ["dep:hyper-tls", "dep:tokio-native-tls"]
# ext: native-tls-alpn
# ext: native-tls-vendored

rustls-tls = ["rustls-tls-aws-lc", "rustls-tls-webpki-roots"]
rustls-tls-aws-lc = [
    "dep:rustls",
    "dep:hyper-rustls",
    "hyper-rustls?/aws-lc-rs",
    "dep:tokio-rustls",
    "tokio-rustls?/aws-lc-rs",
]
rustls-tls-ring = [
    "dep:rustls",
    "dep:hyper-rustls",
    "hyper-rustls?/ring",
    "dep:tokio-rustls",
    "tokio-rustls?/ring",
]
rustls-tls-webpki-roots = [
    "dep:rustls",
    "dep:hyper-rustls",
    "hyper-rustls?/webpki-tokio",
]
rustls-tls-native-roots = [
    "dep:rustls",
    "dep:hyper-rustls",
    "hyper-rustls?/native-tokio",
]

[dependencies]
clickhouse-macros = { version = "0.3.0", path = "macros" }
clickhouse-types = { version = "0.1.4", path = "types" }

serde = { version = "1.0.106", features = ["derive"] }
serde_json = "1"

half = "2.7.1"
thiserror = "2.0"
bytes = { version = "1.5.0", features = ["serde"] }
tokio = { version = "1.0.1", features = ["rt", "macros"] }
http-body-util = "0.1.2"
hyper = "1.4"
hyper-util = { version = "0.1.6", features = ["client-legacy", "http1"] }
hyper-tls = { version = "0.6.0", optional = true }
tokio-native-tls = { version = "0.3", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
hyper-rustls = { version = "0.27.3", default-features = false, features = [
    "http1",
    "tls12",
], optional = true }
url = "2.1.1"
futures-util = { version = "0.3.5", default-features = false, features = ["sink", "io"] }
futures-channel = { version = "0.3.30", features = ["sink"] }
twox-hash = { version = "2.1.4", optional = true }
lz4_flex = { version = "0.14.0", optional = true, default-features = false, features = ["std"] }
cityhash-rs = { version = "=1.0.1", optional = true } # exact version for safety, this package has been stable for years
zstd = { version = "0.13", default-features = false, optional = true }
uuid = { version = "1", optional = true }
time = { version = "0.3", optional = true }
chrono = { version = "0.4", optional = true, features = ["serde"] }
bstr = { version = "1.11.0", default-features = false }
quanta = { version = "0.12", optional = true }
rand = "0.9"

hashbrown = "0.17.1"

bnum = "0.13.0"

tracing = { version = "0.1.44", default-features = false, features = ["std"] }

opentelemetry = { version = "0.31.0", optional = true }
opentelemetry-http = { version = "0.31.0", optional = true }

[dev-dependencies]
tokio = { version = "1.0.1", features = ["full", "test-util", "io-util"] }
hyper = { version = "1.1", features = ["server"] }
serde_bytes = "0.11.4"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3.17", features = ["macros", "rand", "parsing"] }
rand = { version = "0.9", features = ["small_rng"] }
insta = "1.48.0"
serde_repr = "0.1.7"

[lints]
workspace = true
