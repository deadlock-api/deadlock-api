overrides:
  typescript: ^6.0.3
  # postcss accepts any nanoid ^3.3.x, which keeps resolving to 3.3.16 (GHSA-2v37-7h3g-55p8).
  nanoid: ^3.3.18

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - core-js
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
  - workerd

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - lucide-react@1.18.0
  - miniflare@4.20260611.0
  - wrangler@4.100.0
