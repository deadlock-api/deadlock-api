[package]
name = "crosshair-wasm"
version = "0.1.0"
edition.workspace = true
description = "The crosshair crate (share codes, console commands, rendering) compiled to wasm for the website's crosshair editor"

[lib]
# cdylib is the .wasm the website loads, rlib keeps the crate testable natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
crosshair.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-abi.workspace = true

[lints]
workspace = true
