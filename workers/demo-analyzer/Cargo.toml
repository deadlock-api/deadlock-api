[package]
name = "demo-analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
async-compression = { workspace = true, features = ["tokio", "bzip2", "zstd"] }
clap = { workspace = true, features = ["env"] }
clickhouse = { workspace = true, features = ["time"] }
clickhouse-utils = { workspace = true }
db-clients = { workspace = true }
service-utils = { workspace = true }
steam-id = { workspace = true }
telemetry = { workspace = true, features = ["prometheus"] }
futures = { workspace = true }
haste = { workspace = true, features = ["async"] }
metrics = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
valveprotos = { workspace = true, features = ["gc-client"] }

[lints]
workspace = true
