[package]
name = "ingest-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
bzip2 = "0.6"
bytes = "1"
zstd = "0.14"
clap = { workspace = true }
clickhouse = { workspace = true, features = ["test-util", "time"] }
assets-client = { workspace = true }
clickhouse-utils = { workspace = true }
db-clients = { workspace = true }
service-utils = { workspace = true }
telemetry = { workspace = true, features = ["prometheus"] }
futures = { workspace = true }
metrics = { workspace = true }
object_store = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_repr = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
valveprotos = { workspace = true, features = ["gc-client"] }

[lints]
workspace = true
