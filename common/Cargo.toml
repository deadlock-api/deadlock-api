[package]
name = "common"
version = "0.1.0"
edition = "2024"

# Without features it is the plumbing every service shares (tracing, HTTP clients, retries,
# shutdown, Steam ids), so the API and live-events don't compile the tools' database clients.
[features]
# Database and storage clients, ClickHouse batch inserts, asset and account lookups.
clients = ["dep:clickhouse", "dep:metrics", "dep:object_store", "dep:redis", "dep:serde", "dep:sqlx"]
# Prometheus scrape endpoint for the `metrics` facade.
prometheus = ["dep:metrics-exporter-prometheus"]
# sv-proxy request and response types, and a client for them.
steam-proxy = ["dep:base64", "dep:metrics", "dep:prost", "dep:serde", "dep:valveprotos"]

[dependencies]
base64 = { workspace = true, optional = true }
clickhouse = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { version = "0.18", optional = true }
object_store = { workspace = true, optional = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-appender-tracing = { workspace = true, features = ["experimental_span_attributes"] }
prost = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true, features = ["macros", "postgres", "runtime-tokio", "time"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tryhard = { workspace = true }
valveprotos = { workspace = true, optional = true, features = ["gc-client", "serde"] }

[dev-dependencies]
serde_json = { workspace = true }
clickhouse = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread"] }

[lints]
workspace = true
