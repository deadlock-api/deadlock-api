[package]
name = "deadlock-api-rust"
version = "0.1.0"
edition = "2024"
description = "API for Deadlock game data"
repository = "https://github.com/deadlock-api/deadlock-api"
license = "MIT"

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "http2", "zstd", "gzip", "form", "stream"] }
wreq = { version = "6.0.0-rc.31", features = ["cookies"] }
wreq-util = "3.0.0-rc.14"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
opentelemetry = { version = "0.32", features = ["logs", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["logs", "trace"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "logs", "trace"] }
opentelemetry-appender-tracing = { version = "0.32", features = ["experimental_metadata_attributes", "experimental_span_attributes"] }
tracing-opentelemetry = "0.33"
redis = { version = "1.6.0", default-features = false, features = ["tokio-comp"] }
clickhouse = { version = "0.15.2", features = ["chrono", "uuid"] }
sqlx = { version = "0.9.0", features = ["chrono", "derive", "postgres", "runtime-tokio", "uuid"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
cached = { version = "3.1", features = ["async"] }
axum = "0.8.9"
utoipa-axum = "0.2.0"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0.151"
object_store = { version = "0.14.1", features = ["aws"], default-features = false }
tower = { version = "0.5.3", features = ["limit", "tokio"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
tower-http = { version = "0.7.0", features = ["compression-full", "cors", "decompression-full", "normalize-path", "trace", "limit"] }
tracing = "0.1.44"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
axum-prometheus = "0.10.1"
itertools = "0.15.0"
futures = "0.3.34"
snap = "1.1.2"
valveprotos = { git = "https://github.com/deadlock-api/valveprotos-rs.git", rev = "4f4a3cb1b0c6f19af59a722acb79ecccd01f61f6", features = ["gc-client", "serde", "user-msgs", "reflect"] }
prost = "0.14.4"
base64 = "0.23.1"
tryhard = "0.5.2"
async-compression = { version = "0.4.43", features = ["bzip2", "zstd", "tokio"] }
bzip2 = "0.6"
zstd = "0.13"
arrow = { version = "59", features = ["json"] }
strum = { version = "0.28.0", features = ["derive"] }
axum-extra = { version = "0.12.6", features = ["query"] }
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-axum = "7"
metrics = "0.24.6"
bytes = { version = "1.12.1", features = ["serde"] }
thiserror = "2.0.20"
rand = "0.10.2"
quick-xml = { version = "0.42.0", features = ["serde", "serialize"] }
serde-env = "0.3.0"
regex = "1.13.1"
memchr = "2"
mimalloc = "0.1.52"
urlencoding = "2.1.3"
url = "2.5.8"
aes-gcm = "0.11"
hex = "0.4"
hmac = "0.13"
md5 = { package = "md-5", version = "0.11" }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
async-trait = "0.1.92"
tantivy = { version = "0.26.1", features = ["zstd-compression"] }
arc-swap = "1.9.2"
cssparser = "0.37"
indexmap = { version = "2", features = ["serde"] }
murmur2 = "0.1.0"
datafusion = { version = "55", default-features = false, features = [
    "sql",
    "parquet",
    "recursive_protection",
    "string_expressions",
    "datetime_expressions",
    "regex_expressions",
    "unicode_expressions",
    "nested_expressions",
    "crypto_expressions",
    "encoding_expressions",
] }
haste_core = { git = "https://github.com/deadlock-api/haste.git", rev = "bfb292d4798031350861ad297aa26753267a1ea6" }
haste_broadcast = { git = "https://github.com/deadlock-api/haste.git", rev = "bfb292d4798031350861ad297aa26753267a1ea6" }
rayon = "1"
tokio-util = { version = "0.7.19", features = ["io"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
ab_glyph = "0.2.32"

[build-dependencies]
prost-reflect = "0.16"
heck = "0.5"

[dev-dependencies]
clickhouse-sql-parser = { git = "https://github.com/raimannma/clickhouse-antlr4", version = "0.1.0" }
proptest = "1"
proptest-derive = "0.8"
rstest = "0.26.1"
insta = { version = "1", features = ["json"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.test.package.clickhouse-sql-parser]
opt-level = 3
[profile.test.package.antlr4rust]
opt-level = 3
