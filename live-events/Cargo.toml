[package]
name = "deadlock-live-events"
version = "0.1.0"
edition = "2024"
description = "API for Deadlock live events"
repository = "https://github.com/deadlock-api/deadlock-live-events"
license = "MIT"

[dependencies]
common = { workspace = true }
reqwest = { version = "0.13.5", features = ["json", "http2", "gzip"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tower-layer = "0.3.3"
tower-http = { version = "0.7.1", features = ["cors", "normalize-path", "trace", "limit"] }
tracing = "0.1.44"
futures = "0.3.34"
valveprotos = { workspace = true, features = ["serde", "user-msgs", "game-msgs"] }
prost = "0.14.4"
tryhard = "0.5.2"
strum = { version = "0.28.0", features = ["derive"] }
haste = { workspace = true, features = ["async"] }
async-stream = "0.3.6"
thiserror = "2.0.21"
serde-env = "0.3.0"
bytes = "1.12.1"

[lints]
workspace = true
