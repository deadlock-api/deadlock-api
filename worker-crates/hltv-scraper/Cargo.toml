[package]
name = "hltv-scraper"
version = "0.1.0"
edition = "2024"

[dependencies]
async-compression = { workspace = true, features = ["tokio", "bzip2", "zstd"] }
axum = "0.8.9"
base64 = { workspace = true }
bytes = { workspace = true }
cached = { workspace = true, features = ["async"] }
clap = { workspace = true, features = ["env"] }
db-clients = { workspace = true }
service-utils = { workspace = true }
telemetry = { workspace = true, features = ["prometheus"] }
dashmap = "6.2.1"
dungers = { workspace = true, features = ["bitbuf"] }
haste = { workspace = true }
itertools = { workspace = true }
jiff = { version = "0.2.38", features = ["serde"] }
lru = "0.19.0"
metrics = { workspace = true }
object_store = { workspace = true }
prost = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2.5.8"
valveprotos = { workspace = true, features = ["user-msgs"] }

[lints]
workspace = true
