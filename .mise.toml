[tools]
node = "26"
pnpm = "12.1.0"
java = "temurin-21"
uv = "latest"
lefthook = "latest"
"cargo:typos-cli" = "latest"
"cargo:cargo-machete" = "latest"

[settings]
# Rust comes from rust-toolchain.toml; a `rust` tool here would override it.
idiomatic_version_file_enable_tools = ["rust"]

[tasks.setup]
description = "Install dev tools and git hooks"
run = [
  "rustup component add rustfmt clippy",
  "cd website && pnpm install",
  "lefthook install",
]

[tasks.update-assets]
description = "Rebuild all game assets from Steam and upload them to R2 (incl. index rebuild)"
run = [
  "bash scripts/build_version_and_upload.sh"
]
